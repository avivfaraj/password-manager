name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build --tag password-manager:ci .

      - name: Run pytest in Docker container
        run: docker run --rm --entrypoint python --env PYTHONPATH=/app password-manager:ci -m pytest -q
